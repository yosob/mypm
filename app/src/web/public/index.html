<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mypm 看板</title>
<script src="vendor/dhtmlx/dhtmlxgantt.js"></script>
<link rel="stylesheet" href="vendor/dhtmlx/dhtmlxgantt.css">
<style>
  :root { --c1:#4a6fa5; --danger:#c0392b; --warn:#d4a017; --ok:#27ae60; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Segoe UI","Microsoft YaHei",sans-serif; background:#f4f5f7; color:#2c3e50; padding:16px 20px; }
  h1 { font-size: 20px; margin-bottom: 12px; display:flex; align-items:center; gap:14px; }
  .tabs { display:inline-flex; background:#e8eaed; border-radius:8px; padding:3px; }
  .tabs button { border:0; background:transparent; padding:5px 18px; border-radius:6px; cursor:pointer; font-size:14px; color:#5f6b76; }
  .tabs button.active { background:#fff; color:var(--c1); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.1); }

  .cards { display:flex; gap:12px; margin:12px 0; }
  .card { background:#fff; border-radius:8px; padding:10px 18px; box-shadow:0 1px 3px rgba(0,0,0,.08); min-width:110px; }
  .card .num { font-size:24px; font-weight:600; }
  .card .lbl { font-size:12px; color:#7f8c8d; }
  .card.warn .num { color:var(--danger); }

  .statbar-wrap { background:#fff; border-radius:8px; padding:12px 16px; box-shadow:0 1px 3px rgba(0,0,0,.08); margin-bottom:12px; }
  .statbar { display:flex; height:14px; border-radius:7px; overflow:hidden; background:#e8eaed; }
  .statbar .s-todo { background:#95a5a6; } .statbar .s-doing { background:var(--c1); } .statbar .s-done { background:var(--ok); }
  .statbar-legend { display:flex; gap:16px; margin-top:6px; font-size:12px; color:#7f8c8d; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; }

  .progress-row { display:flex; gap:12px; overflow-x:auto; padding-bottom:4px; }
  .progress-card { background:#fff; border-radius:8px; padding:10px 14px; box-shadow:0 1px 3px rgba(0,0,0,.08); min-width:210px; font-size:13px; }
  .progress-card .bar { height:8px; border-radius:4px; background:#e8eaed; margin-top:7px; overflow:hidden; }
  .progress-card .bar i { display:block; height:100%; border-radius:4px; }
  .progress-card .meta { color:#7f8c8d; font-size:12px; margin-top:4px; }

  .toolbar { margin:4px 0 12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  select, .searchbox, button.viewbtn { padding:6px 10px; border:1px solid #d0d4d8; border-radius:6px; background:#fff; font-size:13px; }
  .searchbox { width:180px; }
  button.viewbtn { cursor:pointer; }
  button.viewbtn.active { background:var(--c1); color:#fff; border-color:var(--c1); }

  .layout { display:flex; gap:16px; align-items:flex-start; }
  .gantt-wrap { background:#fff; border-radius:8px; padding:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); overflow-x:auto; flex:1; min-width:0; }
  .side { width:380px; flex-shrink:0; }
  table { width:100%; border-collapse:collapse; background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.08); font-size:13px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid #eef0f2; }
  th { background:#fafbfc; font-weight:600; color:#7f8c8d; font-size:12px; }
  tr.done td { color:#b0b6bc; text-decoration:line-through; }
  tr { cursor:pointer; }
  .pflag { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; color:#fff; margin-right:6px; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; }
  .badge.todo { background:#eceff1; color:#78909c; }
  .badge.doing { background:#e8f0fb; color:var(--c1); }
  .badge.done { background:#e8f8f0; color:var(--ok); }
  .due-cell { border-radius:6px; padding:2px 8px; display:inline-block; font-size:12px; }
  .due-cell.overdue { background:var(--danger); color:#fff; }
  .due-cell.soon { background:#fdf3d7; color:#9c7a10; }
  .res-panel { background:#fff; border-radius:8px; padding:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); margin-top:14px; font-size:13px; }
  .res-panel h3 { font-size:14px; margin-bottom:8px; }
  .res-item { padding:4px 0; border-bottom:1px dashed #eef0f2; word-break:break-all; line-height:1.6; }
  #modal-res-list .res-item { font-size:13px; padding:6px 0; }
  #modal-res-list a { word-break:break-all; }
  .res-item a { color:var(--c1); }
  .hist { margin-top:6px; color:#7f8c8d; font-size:12px; line-height:1.6; }
  .empty { color:#95a5a6; padding:20px; text-align:center; background:#fff; border-radius:8px; }

  /* dhtmlx 甘特定制 */
  #gantt { height:100%; }
  .gantt-wrap { min-height:340px; }
  .gantt_grid_head_cell, .gantt_grid_cell { border-color:#eef0f2 !important; font-size:12px; }
  .gantt_row, .gantt_row.odd { background:#fff; }
  .gantt_row:hover { background:#f4f7fb; }
  .gantt_row.gantt_project { background:#fafbfd; font-weight:600; }
  .gantt_task_line { border-radius:5px !important; box-shadow:0 1px 2px rgba(0,0,0,.18); }
  .gantt_task_content { font-size:12px; padding:0 8px; color:#fff; }
  .pc0 .gantt_task_content,.pc0{background:#4a6fa5 !important;} .pc1 .gantt_task_content,.pc1{background:#7a9e7e !important;}
  .pc2 .gantt_task_content,.pc2{background:#b08552 !important;} .pc3 .gantt_task_content,.pc3{background:#8a6f9e !important;}
  .pc4 .gantt_task_content,.pc4{background:#a05a7e !important;} .pc5 .gantt_task_content,.pc5{background:#5a8ea0 !important;}
  .gantt_task_line.g-overdue { box-shadow:0 0 0 2px var(--danger) inset; }
  .gantt_task_line.g-soon { box-shadow:0 0 0 2px var(--warn) inset; }
  .gantt_task_line.g-ms { box-shadow:0 0 0 2px #fff, 0 0 0 4px rgba(0,0,0,.25); }
  .today_marker { background:var(--danger); width:2px; opacity:.85; }
  .today_marker::before { content:"今天"; position:absolute; top:-18px; left:-12px; font-size:10px; color:var(--danger); }
  .gantt_tooltip { font-size:12px; }

  /* 看板视图 */
  #view-kanban { display:none; }
  .kanban-cols { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; align-items:start; }
  .kcol { background:#edeff2; border-radius:10px; padding:10px; min-height:300px; }
  .kcol.dragover { outline:2px dashed var(--c1); outline-offset:-4px; }
  .kcol h4 { font-size:13px; color:#5f6b76; padding:2px 4px 10px; display:flex; justify-content:space-between; }
  .kcard { background:#fff; border-radius:8px; padding:10px 12px; margin-bottom:8px; cursor:grab; box-shadow:0 1px 2px rgba(0,0,0,.12); border-left:4px solid transparent; }
  .kcard:active { cursor:grabbing; }
  .kcard .kt { font-size:13px; line-height:1.45; }
  .kcard .km { display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
  .kcard .kp { font-size:11px; color:#7f8c8d; }
  .kcard .kd { font-size:11px; border-radius:8px; padding:1px 8px; }
  .kcard .kd.overdue { background:var(--danger); color:#fff; }
  .kcard .kd.soon { background:#fdf3d7; color:#9c7a10; }
  .kcard .kd.norm { background:#eceff1; color:#78909c; }

  /* 任务详情侧栏（重构版） */
  #detail { position:fixed; inset:0; background:rgba(15,25,35,.4); z-index:55; display:none; align-items:flex-start; justify-content:center; padding:4vh 16px; }
  #detail.open { display:flex; }
  .dt-box { position:relative; width:760px; max-width:96vw; max-height:90vh; background:#fff; border-radius:14px; box-shadow:0 14px 56px rgba(0,0,0,.3); display:flex; flex-direction:column; overflow:hidden; animation:dtIn .18s ease-out; }
  @keyframes dtIn { from { transform:translateY(10px); opacity:0; } to { transform:none; opacity:1; } }
  #detail-body { display:flex; flex-direction:column; min-height:0; }
  .dt-scroll { flex:1; overflow-y:auto; padding:0 24px 12px; }
  .dt-head { position:sticky; top:0; background:linear-gradient(#fff 82%,rgba(255,255,255,0)); padding:18px 48px 10px 0; z-index:2; }
  .dt-head .dt-proj { font-size:12px; margin-bottom:6px; }
  .dt-head h2 { font-size:16px; line-height:1.45; margin:0; padding-right:4px; }
  .dt-badges { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  #detail .close { position:absolute; top:14px; right:14px; width:30px; height:30px; border-radius:50%; border:0; background:#f0f2f5; font-size:16px; cursor:pointer; color:#5f6b76; z-index:3; }
  #detail .close:hover { background:#e4e8ee; }
  .dt-metas { margin:12px 0 4px; border:1px solid #eef0f3; border-radius:10px; overflow:hidden; }
  .dt-metas .row { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; font-size:13px; border-bottom:1px solid #f3f5f7; }
  .dt-metas .row:last-child { border-bottom:0; }
  .dt-metas .k { color:#8a95a1; font-size:12px; }
  .dt-metas .v { color:#2c3e50; font-weight:500; text-align:right; }
  .dt-seg { display:flex; background:#eef1f5; border-radius:9px; padding:3px; margin:12px 0; }
  .dt-seg button { flex:1; border:0; background:transparent; padding:7px 0; border-radius:7px; cursor:pointer; font-size:13px; color:#5f6b76; }
  .dt-seg button.cur { background:#fff; color:var(--c1); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .dt-seg button.cur.donebtn { color:var(--ok); }
  .dt-sec { background:#fafbfc; border:1px solid #eef0f3; border-radius:10px; padding:10px 12px; margin:10px 0; }
  .dt-sec > .sec-title { font-size:12px; font-weight:600; color:#7f8c8d; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .dt-sec .res-item { padding:5px 0; font-size:13px; }
  .dt-sec .desc { background:#fff; border:1px solid #eef0f3; border-radius:8px; padding:9px 11px; font-size:13px; white-space:pre-wrap; line-height:1.6; }
  .dt-sec .timeline-item { font-size:12px; color:#5f6b76; padding:5px 0; border-bottom:1px dashed #e8ebee; line-height:1.55; }
  .dt-sec .timeline-item:last-child { border-bottom:0; }
  .dt-foot { border-top:1px solid #eef0f3; background:#fff; padding:13px 24px 15px; display:flex; gap:10px; }
  .dt-foot button { flex:1; padding:9px 0; border-radius:8px; border:1px solid #d0d4d8; background:#fff; cursor:pointer; font-size:13px; }
  .dt-foot button.primary { background:var(--c1); color:#fff; border-color:var(--c1); }
  .dt-foot button.danger { color:var(--danger); border-color:#eecfcb; background:#fff; }
  #detail .editrow { margin:8px 0 12px; }
  #detail .editrow label { display:block; font-size:12px; color:#7f8c8d; margin-bottom:4px; }
  #detail .editrow input, #detail .editrow textarea, #detail .editrow select { width:100%; padding:7px 9px; border:1px solid #d0d4d8; border-radius:7px; font-size:13px; font-family:inherit; background:#fff; }
  #detail h5 { font-size:12px; color:#7f8c8d; margin:0 0 6px; }
</style>
</head>
<body>
<h1>📋 mypm 项目看板
  <span class="tabs">
    <button id="tab-overview" class="active">📈 甘特图</button>
    <button id="tab-list">📋 任务列表</button>
    <button id="tab-kanban">🗂 看板</button>
  </span>
</h1>

<div class="cards">
  <div class="card"><div class="num" id="n-projects">-</div><div class="lbl">进行中项目</div></div>
  <div class="card"><div class="num" id="n-soon">-</div><div class="lbl">7 天内到期</div></div>
  <div class="card warn"><div class="num" id="n-overdue">-</div><div class="lbl">已逾期</div></div>
</div>

<div class="statbar-wrap">
  <div class="statbar" id="statbar"></div>
  <div class="statbar-legend" id="statbar-legend"></div>
</div>

<div class="progress-row" id="progress-row"></div>

<div class="toolbar">
  <select id="proj-filter"></select>
  <select id="status-filter">
    <option value="all">全部状态</option><option value="todo">待办</option>
    <option value="doing">进行中</option><option value="done">已完成</option>
  </select>
  <input class="searchbox" id="search" placeholder="搜索任务/项目…">
  <select id="sort">
    <option value="due-asc">截止日 ↑</option><option value="due-desc">截止日 ↓</option><option value="created-desc">创建日 ↓</option>
  </select>
  <button class="viewbtn" data-mode="Day">日</button>
  <button class="viewbtn active" data-mode="Week">周</button>
  <button class="viewbtn" data-mode="Month">月</button>
  <button class="viewbtn" data-mode="Year">年</button>
  <button class="viewbtn addbtn" id="btn-add" style="background:var(--ok);color:#fff;border-color:var(--ok)">＋ 新建任务</button>
  <button class="viewbtn" id="btn-add-proj" style="background:#fff;">＋ 新建项目</button>
  <button class="viewbtn" id="btn-fields" style="background:#fff;">⚙ 自定义字段</button>
</div>

<!-- 总览视图 -->
<div id="view-overview">
  <div class="gantt-wrap"><div id="gantt"></div></div>
</div>

<div id="view-list" style="display:none">
  <div class="layout">
    <div style="flex:1;min-width:0">
      <table id="task-table"><thead><tr><th style="width:34px"></th><th>任务</th><th>项目</th><th>状态</th><th>优先级</th><th>开始</th><th>截止</th></tr></thead><tbody></tbody></table>
    </div>
    <div class="side" style="width:340px;flex-shrink:0">
      <div class="res-panel" id="res-panel" style="display:none"><h3 id="res-title"></h3><div id="res-body"></div></div>
    </div>
  </div>
</div>

<!-- 看板视图 -->
<div id="view-kanban">
  <div class="kanban-cols">
    <div class="kcol" data-status="todo"><h4>📥 待办 <span class="cnt"></span></h4><div class="kbody"></div></div>
    <div class="kcol" data-status="doing"><h4>🔨 进行中 <span class="cnt"></span></h4><div class="kbody"></div></div>
    <div class="kcol" data-status="done"><h4>✅ 已完成 <span class="cnt"></span></h4><div class="kbody"></div></div>
  </div>
</div>

<!-- 任务详情侧栏 -->
<div id="detail" onclick="if(event.target===this)closeDetail()">
  <div class="dt-box">
    <button class="close" onclick="closeDetail()">×</button>
    <div id="detail-body"></div>
  </div>
</div>

<!-- 字段管理弹窗 -->
<div id="fields-mask" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60" onclick="closeFields()">
  <div onclick="event.stopPropagation()" style="position:absolute;top:10%;left:50%;transform:translateX(-50%);width:420px;background:#fff;border-radius:12px;padding:22px;box-shadow:0 8px 40px rgba(0,0,0,.25)">
    <h3 style="margin-bottom:6px">⚙ 自定义字段</h3>
    <div style="font-size:12px;color:#7f8c8d;margin-bottom:12px">为任务添加额外属性（如：负责人、合同号、预算…），在任务详情侧栏编辑</div>
    <div id="fields-list"></div>
    <div class="tres-add" style="display:flex;gap:6px;margin-top:14px">
      <input id="f-name" placeholder="字段名" style="flex:1">
      <select id="f-type" style="flex:0 0 76px"><option value="text">文本</option><option value="number">数字</option><option value="date">日期</option><option value="select">单选</option></select>
      <input id="f-options" placeholder="选项,逗号分隔" style="flex:0 0 120px;display:none">
    </div>
    <div class="mops"><button onclick="closeFields()">关闭</button><button class="primary" id="f-add">添加字段</button></div>
  </div>
</div>

<!-- 项目弹窗 -->
<div id="proj-mask" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60" onclick="closeProjModal()">
  <div onclick="event.stopPropagation()" style="position:absolute;top:6%;left:50%;transform:translateX(-50%);width:680px;max-width:94vw;max-height:88vh;overflow-y:auto;background:#fff;border-radius:14px;padding:24px 26px;box-shadow:0 12px 48px rgba(0,0,0,.28)">
    <h3 style="margin-bottom:16px" id="proj-modal-title">新建项目</h3>
    <div class="mform">
      <div style="display:flex;gap:14px">
        <div style="flex:3"><label>项目名 *</label><input id="p-name"></div>
        <div style="flex:2"><label>状态</label><select id="p-status"><option value="active">推进中</option><option value="paused">已搁置</option><option value="done">已完成</option></select></div>
      </div>
      <label>目标</label><textarea id="p-desc" rows="2" placeholder="这个项目要达成什么？"></textarea>
      <label>项目截止日</label><input id="p-end" type="date">
      <div class="mops"><button onclick="closeProjModal()">取消</button><button class="primary" id="p-save">保存</button></div>
      <div id="modal-res-wrap" style="display:none">
        <div style="border-top:1px solid #eef0f3;margin-top:18px;padding-top:14px">
        <h5 style="font-size:13px;color:#5f6b76;margin:0 0 8px">📎 项目资料（微信群 / 链接 / 备注）</h5>
        <div id="modal-res-list"></div>
        <div style="display:flex;gap:6px;margin-top:8px">
          <select id="mr-type" style="flex:0 0 92px"><option value="wechat_group">微信群</option><option value="link">链接</option><option value="note">备注</option></select>
          <input id="mr-label" placeholder="说明(可选)" style="flex:0 0 90px">
          <input id="mr-value" placeholder="群名或链接" style="flex:1">
          <button onclick="addProjResUI(editingProjId,'modal')" style="flex:0 0 46px">＋</button>
        </div>
        </div>
      </div>
      <button id="p-del" class="dangerbtn" style="display:none">🗑 删除整个项目（含任务/资料/历史）</button>
    </div>
  </div>
</div>

<!-- 新建任务弹窗 -->
<div id="modal-mask" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60" onclick="closeModal()">
  <div id="modal" onclick="event.stopPropagation()" style="position:absolute;top:12%;left:50%;transform:translateX(-50%);width:400px;background:#fff;border-radius:12px;padding:22px;box-shadow:0 8px 40px rgba(0,0,0,.25)">
    <h3 style="margin-bottom:14px">新建任务</h3>
    <div class="mform">
      <label>标题 *</label><input id="m-title" placeholder="要做什么？">
      <label>项目 *</label><select id="m-project"></select>
      <label>开始日</label><input id="m-start" type="date">
      <label>截止日</label><input id="m-due" type="date">
      <label>状态</label><select id="m-status"><option value="todo">待办</option><option value="doing">进行中</option></select>
      <label>优先级</label><select id="m-priority"><option value="P3">P3 普通</option><option value="P2">P2</option><option value="P1">P1</option><option value="P0">P0 紧急</option></select>
      <label>里程碑</label><label style="font-weight:400"><input id="m-milestone" type="checkbox"> 关键节点（◆）</label>
      <label>备注</label><textarea id="m-desc" rows="2"></textarea>
      <div class="mops"><button onclick="closeModal()">取消</button><button class="primary" id="m-save">保存</button></div>
    </div>
  </div>
</div>
<style>
  .mform label { display:block; font-size:12px; color:#7f8c8d; margin:10px 0 4px; }
  .mform input, .mform select, .mform textarea { width:100%; padding:7px 9px; border:1px solid #d0d4d8; border-radius:6px; font-size:13px; font-family:inherit; }
  .mops { display:flex; gap:10px; margin-top:18px; }
  .mops button { flex:1; padding:8px 0; border-radius:6px; border:1px solid #d0d4d8; background:#fff; cursor:pointer; }
  .mops .primary { background:var(--c1); color:#fff; border-color:var(--c1); }
  #detail .editrow { margin:6px 0; }
  #detail .editrow input, #detail .editrow textarea { width:100%; padding:6px 8px; border:1px solid #d0d4d8; border-radius:6px; font-size:13px; font-family:inherit; }
  .dangerbtn { width:100%; margin-top:18px; padding:7px 0; border-radius:6px; border:1px solid #e5b4b0; background:#fdf2f1; color:var(--danger); cursor:pointer; font-size:13px; }
  .dangerbtn:hover { background:#fbe4e2; }
</style>

<script>
let DATA=null, curView="Week", curTab="overview", curTaskId=null, editing=false;
const gantt = (typeof Gantt !== "undefined" && Gantt.getGanttInstance) ? Gantt.getGanttInstance() : null;
const COLORS=["#4a6fa5","#7a9e7e","#b08552","#8a6f9e","#a05a7e","#5a8ea0"];
const STATUS_TXT={todo:"待办",doing:"进行中",done:"已完成"};

function localDate(d){return new Intl.DateTimeFormat("en-CA",{year:"numeric",month:"2-digit",day:"2-digit"}).format(d);}
function addDays(dstr,n){const x=new Date(dstr+"T12:00:00");x.setDate(x.getDate()+n);return localDate(x);}
function statusOf(t){return t.done?"done":(t.status||"todo");}
function projColor(id){return COLORS[id%6];}
function findProj(id){return DATA.projects.find(p=>p.id===id);}
function dueInfo(t){
  if(!t.due_date) return {cls:"",txt:""};
  const today=localDate(new Date()), left=Math.round((Date.parse(t.due_date)-Date.parse(today))/864e5);
  const overdue=left<0&&!t.done, soon=left>=0&&left<=3&&!t.done;
  return {cls:overdue?"overdue":soon?"soon":"", txt:t.due_date+(overdue?" 逾期":left===0?" 今天":left>0&&left<=7?` ${left}天`:""), overdue, soon};
}

async function load(){
  DATA=await (await fetch("/api/dashboard")).json();
  document.getElementById("n-projects").textContent=DATA.summary.projects;
  document.getElementById("n-soon").textContent=DATA.summary.dueSoon;
  document.getElementById("n-overdue").textContent=DATA.summary.overdue;
  const sel=document.getElementById("proj-filter");
  const prevSel=sel.value; // load 重建下拉会重置选择，先记住再恢复
  sel.innerHTML='<option value="all">全部项目</option>'+DATA.projects.map(p=>`<option value="${p.id}">${p.name}</option>`).join("");
  if([...sel.options].some(o=>o.value===prevSel)) sel.value=prevSel;
  sel.onchange=()=>{render();showRes(sel.value);};
  document.getElementById("status-filter").onchange=render;
  document.getElementById("search").oninput=render;
  document.getElementById("sort").onchange=render;
  document.querySelectorAll(".viewbtn").forEach(b=>b.onclick=()=>{
    document.querySelectorAll(".viewbtn").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");curView=b.dataset.mode;
    if(ganttInited)applyScale(curView);
  });
  document.getElementById("tab-overview").onclick=()=>switchTab("overview");
  document.getElementById("tab-list").onclick=()=>switchTab("list");
  document.getElementById("tab-kanban").onclick=()=>switchTab("kanban");
  document.getElementById("btn-add").onclick=openModal;
  document.getElementById("m-save").onclick=saveTask;
  document.getElementById("btn-add-proj").onclick=()=>openProjModal(null);
  document.getElementById("btn-fields").onclick=openFields;
  document.getElementById("f-add").onclick=addFieldUI;
  document.getElementById("f-type").onchange=e=>{
    document.getElementById("f-options").style.display=e.target.value==="select"?"":"none";
  };
  document.getElementById("p-save").onclick=saveProject;
  renderStats();render();
  if(!editingResKey&&!editing)showRes(document.getElementById("proj-filter").value);
  if(curTaskId&&!editing&&!editingResKey)fillDetail(curTaskId);
}

function switchTab(t){
  curTab=t;
  document.getElementById("tab-overview").classList.toggle("active",t==="overview");
  document.getElementById("tab-list").classList.toggle("active",t==="list");
  document.getElementById("tab-kanban").classList.toggle("active",t==="kanban");
  document.getElementById("view-overview").style.display=t==="overview"?"":"none";
  document.getElementById("view-list").style.display=t==="list"?"":"none";
  document.getElementById("view-kanban").style.display=t==="kanban"?"":"none";
  showRes(document.getElementById("proj-filter").value);
}

function visibleProjects(){
  const v=document.getElementById("proj-filter").value;
  return v==="all"?DATA.projects:DATA.projects.filter(p=>p.id===+v);
}
function filteredTasks(projs){
  const st=document.getElementById("status-filter").value;
  const q=document.getElementById("search").value.trim().toLowerCase();
  const sort=document.getElementById("sort").value;
  let ts=[];projs.forEach(p=>ts.push(...p.tasks));
  if(st!=="all")ts=ts.filter(t=>statusOf(t)===st);
  if(q)ts=ts.filter(t=>t.title.toLowerCase().includes(q)||(t.project_name||"").toLowerCase().includes(q));
  ts.sort((a,b)=>{
    if(sort==="created-desc")return b.id-a.id;
    const ad=a.due_date||"9999",bd=b.due_date||"9999";
    return sort==="due-desc"?bd.localeCompare(ad):ad.localeCompare(bd);
  });
  return ts;
}

function renderStats(){
  const all=[];DATA.projects.forEach(p=>all.push(...p.tasks));
  const n={todo:0,doing:0,done:0};all.forEach(t=>n[statusOf(t)]++);
  const total=all.length||1;
  document.getElementById("statbar").innerHTML=
    `<div class="s-todo" style="width:${n.todo/total*100}%"></div>`+
    `<div class="s-doing" style="width:${n.doing/total*100}%"></div>`+
    `<div class="s-done" style="width:${n.done/total*100}%"></div>`;
  document.getElementById("statbar-legend").innerHTML=
    `<span><i class="dot" style="background:#95a5a6"></i>待办 ${n.todo}</span>`+
    `<span><i class="dot" style="background:var(--c1)"></i>进行中 ${n.doing}</span>`+
    `<span><i class="dot" style="background:var(--ok)"></i>已完成 ${n.done}</span>`;
  document.getElementById("progress-row").innerHTML=DATA.projects.map(p=>{
    const t=p.tasks.length, d=p.tasks.filter(x=>x.done).length, pct=t?Math.round(d/t*100):0;
    const stTxt={active:"推进中",done:"已完成",paused:"已搁置"}[p.status]||p.status;
    const stCls=p.status==="done"?"done":p.status==="paused"?"todo":"doing";
    return `<div class="progress-card" onclick="editProject(${p.id})" style="cursor:pointer">
      <div><span class="dot" style="background:${projColor(p.id)}"></span><b>${p.name}</b> <span class="badge ${stCls}" style="margin-left:4px">${stTxt}</span></div>
      ${p.description?`<div class="meta" style="margin-top:5px;white-space:normal">🎯 ${p.description}</div>`:""}
      <div class="bar"><i style="width:${pct}%;background:${projColor(p.id)}"></i></div>
      <div class="meta">${d}/${t} 完成 · ${pct}%${p.end_date?` · 项目截止 ${p.end_date}`:""}</div></div>`;
  }).join("");
}

function render(){
  const projs=visibleProjects();
  const ts=filteredTasks(projs);
  renderGantt(ts,projs);
  renderTable(ts);
  renderKanban(ts);
}

let ganttInited=false;
function applyScale(mode){
  const g=gantt;
  if(mode==="Day"){g.config.scale_unit="day";g.config.step=1;g.config.date_scale="%d日";g.config.subscales=[];}
  else if(mode==="Week"){g.config.scale_unit="week";g.config.step=1;g.config.date_scale="%d日";g.config.subscales=[{unit:"day",step:1,date:"%d"}];}
  else if(mode==="Month"){g.config.scale_unit="month";g.config.step=1;g.config.date_scale="%Y年%M";g.config.subscales=[{unit:"week",step:1,date:"%d日"}];}
  else {g.config.scale_unit="quarter";g.config.step=1;g.config.date_scale="%Y年";g.config.subscales=[{unit:"month",step:1,date:"%M"}];}
  g.render();
}
function renderGantt(ts,projs){
  if(!gantt)return;
  const g=gantt;
  const today=localDate(new Date());
  const data=[];
  projs.forEach((p,pi)=>{
    data.push({id:`p${p.id}`,text:`📁 ${p.name}`,open:true,type:"project",
      progress:p.tasks.length?Math.round(p.tasks.filter(t=>t.done).length/p.tasks.length*100)/100:0,color_idx:pi%6});
    ts.filter(t=>t.project_id===p.id&&!t.done).forEach(t=>{
      const di=dueInfo(t);
      const start=t.start_date||t.created_at;
      const due=t.due_date||addDays(start,7);
      const dur=Math.max(1,Math.round((Date.parse(due)-Date.parse(start))/864e5)+1);
      data.push({id:String(t.id),text:(t.is_milestone?"◆ ":"")+t.title,
        start_date:t.is_milestone?(t.due_date||due):start,
        duration:t.is_milestone?1:dur,
        type:t.is_milestone?"milestone":"task",
        parent:`p${p.id}`,color_idx:pi%6,due_txt:(t.due_date||"").slice(5),start_txt:(t.is_milestone?(t.due_date||due):start).slice(5),
        warn:di.overdue?"overdue":di.soon?"soon":null});
    });
  });
  const el=document.getElementById("gantt");
  el.style.height=Math.min(760,Math.max(300,data.length*30+70))+"px";
  if(!ganttInited){
    g.plugins({tooltip:true});
    g.config.date_format="%Y-%m-%d";
    g.config.row_height=30; g.config.scale_height=44;
    g.config.readonly=true;
    g.config.columns=[
      {name:"text",label:"任务",tree:true,width:230},
      {name:"start_date",label:"开始",align:"center",width:64,template:t=>t.start_txt||""},
      {name:"due",label:"截止",align:"center",width:64,template:t=>t.due_txt||""},
    ];
    g.config.show_progress=false;
    g.templates.task_class=(start,end,task)=>{
      if(String(task.id).startsWith("p")) return "gantt_project_row";
      const cls=[`pc${task.color_idx}`];
      if(task.warn==="overdue")cls.push("g-overdue");
      if(task.warn==="soon")cls.push("g-soon");
      if(task.type==="milestone")cls.push("g-ms");
      return cls.join(" ");
    };
    g.attachEvent("onTaskClick",(id)=>{
      if(!String(id).startsWith("p")) fillDetail(+id);
      return true;
    });
    g.init("gantt");
    ganttInited=true;
  }
  g.clearAll();
  g.parse({data,links:[]});
  applyScale(curView);
  drawTodayLine();
}
function drawTodayLine(){
  const g=gantt, host=document.querySelector("#gantt .gantt_data_area");
  document.querySelectorAll(".today_marker").forEach(el=>el.remove());
  if(!host)return;
  const x=g.posFromDate(new Date());
  const line=document.createElement("div");
  line.className="today_marker";
  line.style.cssText=`position:absolute;left:${x}px;top:0;bottom:0;width:2px;background:var(--danger);opacity:.8;z-index:5;pointer-events:none;`;
  host.appendChild(line);
}
function renderTable(ts){
  const tb=document.querySelector("#task-table tbody");
  tb.innerHTML="";
  ts.forEach(t=>{
    const tr=document.createElement("tr");
    if(t.done)tr.className="done";
    const di=dueInfo(t), p=findProj(t.project_id);
    tr.innerHTML=`<td><input type="checkbox" ${t.done?"checked":""} data-id="${t.id}"></td>
      <td>${t.is_milestone?"◆ ":""}${t.title}</td>
      <td><span class="pflag" style="background:${projColor(t.project_id)}">${p?p.name:""}</span></td>
      <td><span class="badge ${statusOf(t)}">${STATUS_TXT[statusOf(t)]}</span></td>
      <td>${t.priority&&t.priority!=="P3"?`<b style="color:${t.priority==="P0"?"var(--danger)":t.priority==="P1"?"#d35400":"#7f8c8d"}">${t.priority}</b>`:"-"}</td>
      <td style="color:#8a95a1">${t.start_date||"-"}</td>
      <td>${t.due_date?`<span class="due-cell ${di.cls}">${di.txt}</span>`:"-"}</td>`;
    tr.onclick=e=>{if(e.target.tagName!=="INPUT")fillDetail(t.id);};
    tr.querySelector("input").onchange=async e=>{
      e.stopPropagation();
      await fetch(`/api/tasks/${e.target.dataset.id}/toggle`,{method:"POST"});
      load();
    };
    tb.appendChild(tr);
  });
}

function renderKanban(ts){
  document.querySelectorAll(".kcol").forEach(col=>{
    const st=col.dataset.status;
    const list=ts.filter(t=>statusOf(t)===st);
    col.querySelector(".cnt").textContent=list.length;
    const body=col.querySelector(".kbody");
    body.innerHTML="";
    list.forEach(t=>{
      const p=findProj(t.project_id), di=dueInfo(t);
      const card=document.createElement("div");
      card.className="kcard";card.draggable=true;
      card.style.borderLeftColor=projColor(t.project_id);
      card.innerHTML=`<div class="kt">${t.is_milestone?"◆ ":""}${t.title}</div>
        <div class="km"><span class="kp">${p?p.name:""}</span>
        ${t.due_date?`<span class="kd ${di.overdue?"overdue":di.soon?"soon":"norm"}">${di.txt}</span>`:""}</div>`;
      card.ondragstart=e=>e.dataTransfer.setData("text/plain",String(t.id));
      card.onclick=()=>fillDetail(t.id);
      body.appendChild(card);
    });
    col.ondragover=e=>{e.preventDefault();col.classList.add("dragover");};
    col.ondragleave=()=>col.classList.remove("dragover");
    col.ondrop=async e=>{
      e.preventDefault();col.classList.remove("dragover");
      const id=e.dataTransfer.getData("text/plain");
      if(statusOf({done:false,status:st})===st&&findTask(id)&&statusOf(findTask(id))===st)return;
      await fetch(`/api/tasks/${id}/status`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:st})});
      load();
    };
  });
}
function findTask(id){id=+id;for(const p of DATA.projects){const t=p.tasks.find(x=>x.id===id);if(t)return t;}return null;}

function fillDetail(id){
  const t=findTask(id);if(!t)return;
  curTaskId=id;editing=false;
  const p=findProj(t.project_id),di=dueInfo(t),st=statusOf(t);

  const badges=[
    t.is_milestone?`<span class="badge todo">◆ 里程碑</span>`:"",
    t.priority&&t.priority!=="P3"?`<span class="badge doing">${t.priority}</span>`:"",
    di.overdue?`<span class="badge" style="background:#fdeceb;color:var(--danger)">已逾期</span>`:
      di.soon?`<span class="badge" style="background:#fdf6e3;color:#9c7a10">${di.txt}</span>`:""
  ].join("");

  let html=`<div class="dt-scroll">
    <div class="dt-head">
      <div class="dt-proj"><span class="pflag" style="background:${projColor(t.project_id)}">${p?p.name:""}</span></div>
      <h2>${t.title}</h2>
      ${badges?`<div class="dt-badges">${badges}</div>`:""}
    </div>
    <div class="dt-seg">
      <button data-st="todo" class="${st==="todo"?"cur":""}">○ 待办</button>
      <button data-st="doing" class="${st==="doing"?"cur":""}">◐ 进行中</button>
      <button data-st="done" class="donebtn ${st==="done"?"cur":""}">● 已完成</button>
    </div>
    <div class="dt-metas">
      <div class="row"><span class="k">排期</span><span class="v">${t.start_date||"…"} ~ ${t.due_date||"…"}</span></div>
      <div class="row"><span class="k">优先级</span><span class="v">${t.priority||"P3"}</span></div>
      <div class="row"><span class="k">创建于</span><span class="v">${t.created_at}</span></div>
    </div>`;

  if(t.description)html+=`<div class="dt-sec"><div class="sec-title">📝 内容</div><div class="desc">${t.description}</div></div>`;

  const trs=t.resources||[];
  html+=`<div class="dt-sec"><div class="sec-title">📎 任务资料</div>
    ${trs.length?trs.map(r=>`<div class="res-item">${tresIcon(r.type)} ${r.label?r.label+" ":""}${
      r.type==="link"?`<a href="${r.value}" target="_blank">${r.value}</a>`:r.value
    } <span style="cursor:pointer;color:#7f8c8d" onclick="editResRow(${r.id},${t.id},'task',this)">✎</span>
      <span class="del-res" style="cursor:pointer;color:#b0b6bc" onclick="delTaskRes(${r.id},${t.id})">×</span></div>`).join(""):`<div class="res-item" style="color:#b0b6bc">（无）</div>`}
    <div class="tres-add" style="display:flex;gap:6px;margin-top:8px">
      <select id="tr-type" style="flex:0 0 84px"><option value="wechat_group">微信群</option><option value="link">链接</option><option value="note">备注</option></select>
      <input id="tr-label" placeholder="说明(可选)" style="flex:0 0 84px">
      <input id="tr-value" placeholder="群名或链接" style="flex:1">
      <button onclick="addTaskResUI(${t.id})" style="flex:0 0 42px">＋</button>
    </div></div>`;

  const cfs=DATA.fields||[];
  if(cfs.length){
    const cv=t.custom||{};
    html+=`<div class="dt-sec"><div class="sec-title">⚙ 自定义字段</div>${
      cfs.map(f=>{
        const v=cv[String(f.id)]??"";
        if(f.type==="select")return `<div class="res-item" style="display:flex;align-items:center;gap:8px">${f.name}<select data-fid="${f.id}" style="flex:1;padding:4px 6px;border:1px solid #d0d4d8;border-radius:5px;font-size:12px"><option value=""></option>${(f.options||"").split(",").filter(Boolean).map(o=>`<option ${v===o?"selected":""}>${o}</option>`).join("")}</select></div>`;
        return `<div class="res-item" style="display:flex;align-items:center;gap:8px">${f.name}<input data-fid="${f.id}" type="${f.type==="date"?"date":f.type==="number"?"number":"text"}" value="${v}" style="flex:1;padding:4px 6px;border:1px solid #d0d4d8;border-radius:5px;font-size:12px"></div>`;
      }).join("")
    }<button class="viewbtn" style="width:100%;margin-top:8px" onclick="saveCustom(${t.id})">保存</button></div>`;
  }

  const subs=DATA.projects.flatMap(x=>x.tasks).filter(x=>x.parent_id===t.id);
  if(t.parent_id||subs.length){
    let rel="";
    if(t.parent_id){const pt=findTask(t.parent_id);if(pt)rel+=`<div class="timeline-item" style="cursor:pointer" onclick="fillDetail(${pt.id})">↖ 父任务：${pt.title}</div>`;}
    rel+=subs.map(x=>`<div class="timeline-item" style="cursor:pointer" onclick="fillDetail(${x.id})">↳ 子任务：${x.title}${x.done?" ✅":""}</div>`).join("");
    html+=`<div class="dt-sec"><div class="sec-title">🔗 关联任务</div>${rel}</div>`;
  }
  if(p&&(p.resources.length||p.history.length)){
    let rel="";
    if(p.resources.length)rel+=p.resources.map(r=>
      `<div class="res-item">${r.type==="wechat_group"?"💬":r.type==="link"?"🔗":"📄"} ${r.label?r.label+" ":""}${r.type==="link"?`<a href="${r.value}" target="_blank">${r.value}</a>`:r.value}
        <span style="cursor:pointer;color:#7f8c8d" onclick="editResRow(${r.id},${p.id},'proj',this)">✎</span>
        <span style="cursor:pointer;color:#b0b6bc" onclick="delProjRes(${r.id},${p.id})">×</span></div>`).join("");
    if(p.history.length)rel+=p.history.map(h=>`<div class="timeline-item"><b>${h.date}</b> ${h.summary}</div>`).join("");
    html+=`<div class="dt-sec"><div class="sec-title">📁 所属项目 · ${p.name}</div>${rel}</div>`;
  }

  html+=`</div>
  <div class="dt-foot">
    <button class="primary" onclick="editDetail(${id})">✏️ 编辑</button>
    <button class="danger" onclick="deleteTaskUI(${id})">🗑 删除</button>
  </div>`;

  const body=document.getElementById("detail-body");
  body.innerHTML=html;
  body.querySelectorAll(".dt-seg button[data-st]").forEach(b=>b.onclick=async()=>{
    await fetch(`/api/tasks/${id}/status`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:b.dataset.st})});
    load();
  });
  document.getElementById("detail").classList.add("open");
}
function closeDetail(){document.getElementById("detail").classList.remove("open");curTaskId=null;editing=false;}
function tresIcon(type){return type==="wechat_group"?"💬":type==="link"?"🔗":"📝";}
async function addTaskResUI(taskId){
  const type=(document.getElementById("tr-type")||{}).value||"wechat_group";
  const value=(document.getElementById("tr-value")||{}).value?.trim();
  const label=(document.getElementById("tr-label")||{}).value?.trim()||"";
  if(!value)return alert("请填内容");
  const r=await fetch(`/api/tasks/${taskId}/resources`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type,value,label})});
  if(!r.ok)return alert("添加失败");
  await load();fillDetail(taskId);
}
async function saveCustom(taskId){
  const patch={};
  document.querySelectorAll("#cfs-box [data-fid]").forEach(el=>{
    patch[el.dataset.fid]=el.value??"";
  });
  const r=await fetch(`/api/tasks/${taskId}/custom`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(patch)});
  if(!r.ok)return alert("保存失败");
  await load();fillDetail(taskId);
}
let editingResKey=null;
async function editResRow(rid,ownerId,kind,el){
  const key=kind+":"+rid;
  if(editingResKey===key)return;
  editingResKey=key;
  editing=true; // 阻止 60s 自动刷新重渲染侧栏/面板
  let r=null;
  if(kind==="proj"){const p=DATA.projects.find(x=>x.id===ownerId);r=p?.resources.find(x=>x.id===rid);}
  else{for(const pr of DATA.projects){const t=pr.tasks.find(x=>x.id===ownerId);if(t){r=(t.resources||[]).find(x=>x.id===rid);break;}}}
  if(!r||!el)return;
  el.innerHTML=`<div style="display:flex;gap:5px;align-items:center">
    <select id="er-type" style="flex:0 0 80px"><option value="wechat_group"${r.type==="wechat_group"?" selected":""}>微信群</option><option value="link"${r.type==="link"?" selected":""}>链接</option><option value="note"${r.type==="note"?" selected":""}>备注</option></select>
    <input id="er-label" value="${(r.label||"").replace(/"/g,"&quot;")}" placeholder="说明" style="flex:0 0 80px"
      onkeydown="if(event.key==='Enter')saveResRow(${rid},${ownerId},'${kind}')">
    <input id="er-value" value="${r.value.replace(/"/g,"&quot;")}" style="flex:1"
      onkeydown="if(event.key==='Enter')saveResRow(${rid},${ownerId},'${kind}');if(event.key==='Escape')cancelResRow(${rid},${ownerId},'${kind}')">
    <button onclick="saveResRow(${rid},${ownerId},'${kind}')" style="flex:0 0 40px">✓</button>
    <button onclick="cancelResRow(${rid},${ownerId},'${kind}')" style="flex:0 0 40px">✕</button>
  </div>`;
}
async function saveResRow(rid,ownerId,kind){
  const body={type:document.getElementById("er-type").value,
    value:document.getElementById("er-value").value.trim(),
    label:document.getElementById("er-label").value.trim()};
  if(!body.value)return alert("内容不能为空");
  const url=kind==="proj"?`/api/resources/${rid}/update`:`/api/task-resources/${rid}/update`;
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok)return alert("保存失败");
  editingResKey=null;editing=false;
  await load();
  if(kind==="proj"){refreshProjRes(ownerId);if(curTaskId)fillDetail(curTaskId);}else fillDetail(ownerId);
}
function cancelResRow(rid,ownerId,kind){
  editingResKey=null;editing=false;
  if(kind==="proj"){refreshProjRes(ownerId);if(curTaskId)fillDetail(curTaskId);}else fillDetail(ownerId);
}
async function delTaskRes(rid,taskId){
  await fetch(`/api/task-resources/${rid}`,{method:"DELETE"});
  await load();fillDetail(taskId);
}

// ---------- 自定义字段 ----------
function openFields(){
  renderFieldsList();
  document.getElementById("fields-mask").style.display="";
}
function closeFields(){document.getElementById("fields-mask").style.display="none";}
function renderFieldsList(){
  const list=document.getElementById("fields-list");
  const fs=DATA.fields||[];
  const typeTxt={text:"文本",number:"数字",date:"日期",select:"单选"};
  list.innerHTML=fs.length?fs.map(f=>`<div class="res-item"><b>${f.name}</b> <span style="color:#7f8c8d">· ${typeTxt[f.type]}${f.type==="select"&&f.options?` · ${f.options}`:""}</span> <span style="cursor:pointer;color:#b0b6bc" onclick="delField(${f.id})">×</span></div>`).join(""):`<div class="res-item" style="color:#b0b6bc">（暂无自定义字段）</div>`;
}
async function delField(id){
  if(!confirm("删除该字段定义？已填写的值会保留在任务数据中但不再显示。"))return;
  await fetch(`/api/fields/${id}`,{method:"DELETE"});
  load();renderFieldsList();
}
async function addFieldUI(){
  const name=document.getElementById("f-name").value.trim();
  if(!name)return alert("请填字段名");
  const body={name,type:document.getElementById("f-type").value,options:document.getElementById("f-options").value.trim()};
  const r=await fetch("/api/fields",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok){const e=await r.json().catch(()=>({}));return alert("添加失败："+(e.error||""));}
  document.getElementById("f-name").value="";document.getElementById("f-options").value="";
  await load();renderFieldsList();
}

// ---------- 项目资料增删 ----------
async function addProjResUI(pid,src){
  const pre=src==="modal"?"mr":"pr";
  const type=(document.getElementById(pre+"-type")||{}).value||"wechat_group";
  const value=(document.getElementById(pre+"-value")||{}).value?.trim();
  const label=(document.getElementById(pre+"-label")||{}).value?.trim()||"";
  if(!value)return alert("请填内容");
  const r=await fetch(`/api/projects/${pid}/resources`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type,value,label})});
  if(!r.ok)return alert("添加失败");
  await load();refreshProjRes(pid);
}
async function delProjRes(rid,pid){
  await fetch(`/api/resources/${rid}`,{method:"DELETE"});
  await load();refreshProjRes(pid);
}

// ---------- 新建任务 ----------
function openModal(){
  const sel=document.getElementById("m-project");
  sel.innerHTML=DATA.projects.map(p=>`<option value="${p.id}">${p.name}</option>`).join("");
  document.getElementById("m-title").value="";
  document.getElementById("m-start").value="";
  document.getElementById("m-due").value="";
  document.getElementById("m-priority").value="P3";
  document.getElementById("m-status").value="todo";
  document.getElementById("m-milestone").checked=false;
  document.getElementById("m-desc").value="";
  document.getElementById("modal-mask").style.display="";
  document.getElementById("m-title").focus();
}
function closeModal(){document.getElementById("modal-mask").style.display="none";}
async function saveTask(){
  const title=document.getElementById("m-title").value.trim();
  if(!title)return alert("请填标题");
  const body={title,project_id:+document.getElementById("m-project").value,
    start_date:document.getElementById("m-start").value||null,
    priority:document.getElementById("m-priority").value,
    due_date:document.getElementById("m-due").value||null,
    status:document.getElementById("m-status").value,
    is_milestone:document.getElementById("m-milestone").checked,
    description:document.getElementById("m-desc").value.trim()};
  const r=await fetch("/api/tasks",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok){const e=await r.json().catch(()=>({}));return alert("保存失败："+(e.error||r.status));}
  closeModal();load();
}

// ---------- 项目新建/编辑 ----------
let editingProjId=null;
function openProjModal(p){
  editingProjId=p?p.id:null;
  document.getElementById("proj-modal-title").textContent=p?"编辑项目":"新建项目";
  document.getElementById("p-name").value=p?p.name:"";
  document.getElementById("p-desc").value=p?(p.description||""):"";
  document.getElementById("p-status").value=p?p.status:"active";
  document.getElementById("p-end").value=p?(p.end_date||""):"";
  document.getElementById("proj-mask").style.display="";
  const delBtn=document.getElementById("p-del");
  delBtn.style.display=p?"":"none";
  delBtn.onclick=deleteProjectUI;
  const resWrap=document.getElementById("modal-res-wrap");
  resWrap.style.display=p?"":"none";
  if(p)document.getElementById("modal-res-list").innerHTML=projResHTML(p);
  document.getElementById("p-name").focus();
}
function closeProjModal(){document.getElementById("proj-mask").style.display="none";}
async function saveProject(){
  const name=document.getElementById("p-name").value.trim();
  if(!name)return alert("请填项目名");
  const body={name,description:document.getElementById("p-desc").value.trim(),
    status:document.getElementById("p-status").value,
    end_date:document.getElementById("p-end").value||null};
  const url=editingProjId?`/api/projects/${editingProjId}/update`:"/api/projects";
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok){const e=await r.json().catch(()=>({}));return alert("保存失败："+(e.error||r.status));}
  closeProjModal();load();
}
function editProject(id){
  const p=DATA.projects.find(x=>x.id===id);
  if(p)openProjModal(p);
}
async function deleteProjectUI(){
  if(!editingProjId)return;
  const p=DATA.projects.find(x=>x.id===editingProjId);
  if(!p)return;
  if(!confirm(`确定删除项目「${p.name}」？
其下所有任务、资料、历史将一并删除，不可恢复！`))return;
  const r=await fetch(`/api/projects/${editingProjId}`,{method:"DELETE"});
  if(!r.ok)return alert("删除失败");
  closeProjModal();load();
}

// ---------- 编辑 / 删除 ----------
function editDetail(id){
  const t=findTask(id);if(!t)return;
  curTaskId=id;editing=true;
  document.getElementById("detail-body").innerHTML=`<div class="dt-scroll">
    <div class="dt-head"><div class="dt-proj"><span class="pflag" style="background:${projColor(t.project_id)}">${findProj(t.project_id)?.name||""}</span></div>
    <h2>编辑任务</h2></div>
    <div class="editrow"><label>标题</label><input id="e-title" value="${t.title.replace(/"/g,"&quot;")}"></div>
    <div style="display:flex;gap:10px">
      <div class="editrow" style="flex:1"><label>开始日</label><input id="e-start" type="date" value="${t.start_date||""}"></div>
      <div class="editrow" style="flex:1"><label>截止日</label><input id="e-due" type="date" value="${t.due_date||""}"></div>
    </div>
    <div style="display:flex;gap:10px">
      <div class="editrow" style="flex:1"><label>优先级</label><select id="e-priority">${["P3","P2","P1","P0"].map(x=>`<option value="${x}" ${t.priority===x?"selected":""}>${x}</option>`).join("")}</select></div>
    </div>
    <div class="editrow"><label>内容 / 备注</label><textarea id="e-desc" rows="4">${t.description||""}</textarea></div>
  </div>
  <div class="dt-foot">
    <button onclick="fillDetail(${id})">取消</button>
    <button class="primary" onclick="saveEdit(${id})">保存</button>
  </div>`;
}
async function saveEdit(id){
  const body={title:document.getElementById("e-title").value.trim()||undefined,
    start_date:document.getElementById("e-start").value||null,
    due_date:document.getElementById("e-due").value||null,
    priority:document.getElementById("e-priority").value,
    description:document.getElementById("e-desc").value};
  const r=await fetch(`/api/tasks/${id}/update`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok)return alert("保存失败");
  load();fillDetail(id);
}
async function deleteTaskUI(id){
  if(!confirm("确定删除这个任务？不可恢复。"))return;
  const r=await fetch(`/api/tasks/${id}`,{method:"DELETE"});
  if(!r.ok)return alert("删除失败");
  closeDetail();load();
}

function showRes(v){
  const panel=document.getElementById("res-panel");
  const p=v==="all"?null:DATA.projects.find(x=>x.id===+v);
  if(!p){panel.style.display="none";return;}
  panel.style.display="";
  document.getElementById("res-title").textContent=`📁 ${p.name} · 资料与历史`;
  document.getElementById("res-body").innerHTML=projResHTML(p)+projResAddRow(p.id,"panel")+
    (p.history.length?`<div class="hist">${p.history.map(h=>`· ${h.date} ${h.summary}`).join("<br>")}</div>`:"");
}
function projResHTML(p){
  if(!p.resources.length)return `<div class="res-item" style="color:#b0b6bc">（暂无资料，用下方添加）</div>`;
  return p.resources.map(r=>`<div class="res-item">${r.type==="wechat_group"?"💬 微信群":r.type==="link"?"🔗":"📄"} ${r.label?r.label+" ":""}${r.type==="link"?`<a href="${r.value}" target="_blank">${r.value}</a>`:r.value}
    <span style="cursor:pointer;color:#7f8c8d" onclick="editResRow(${r.id},${p.id},'proj',this)">✎</span>
    <span style="cursor:pointer;color:#b0b6bc" onclick="delProjRes(${r.id},${p.id})">×</span></div>`).join("");
}
function projResAddRow(pid,src){
  const pre=src==="modal"?"mr":"pr";
  return `<div style="display:flex;gap:6px;margin-top:8px">
    <select id="${pre}-type" style="flex:0 0 92px"><option value="wechat_group">微信群</option><option value="link">链接</option><option value="note">备注</option></select>
    <input id="${pre}-label" placeholder="说明(可选)" style="flex:0 0 90px">
    <input id="${pre}-value" placeholder="群名或链接" style="flex:1">
    <button onclick="addProjResUI(${pid},'${src}')" style="flex:0 0 46px">＋</button>
  </div>`;
}
/** 保存/删除后刷新所有项目资料区块（弹窗 + 右侧面板） */
function refreshProjRes(pid){
  const p=DATA.projects.find(x=>x.id===pid);
  if(!p)return;
  const wrap=document.getElementById("modal-res-wrap");
  if(wrap&&wrap.style.display!=="none"&&editingProjId===pid){
    document.getElementById("modal-res-list").innerHTML=projResHTML(p);
  }
  if(document.getElementById("proj-filter").value===String(pid))showRes(String(pid));
}

load();
setInterval(load,60000);
</script>
</body>
</html>
